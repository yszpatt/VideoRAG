# =============================================================================
# videoRAG —— 标准初始化 docker-compose（适用于他人快速上手 / 全新部署）
#
# 使用前（首次）：
#   1. cp .env.example .env        # 拷贝环境变量模板
#   2. 编辑 .env 填入你的 LLM API Key（默认 DeepSeek，任意 OpenAI 兼容均可）
#   3. docker compose up -d        # 启动主服务 → http://localhost:8080
#   4.（可选·本地 ASR）首次启动后在「设置 → 本地模型」下载 SenseVoice /
#      bge-small 模型，再执行：
#      docker compose --profile local-asr up -d
#
# 本文件不含任何内网 IP / 密钥：全部配置经 ${VAR:-默认值} 从项目 .env 注入，
# 未拷贝 .env 时也能以纯本地档位（fastembed + 本地 SenseVoice）直接跑起来。
#
# 数据目录统一为 ./data（videorag 与 asr 侧车共享，模型/库/笔记都在里面）：
#   videorag 读写 /data；asr 只读共享 /data/models/asr。
# 注意：本机如果已有裸机/旧目录数据，可用 docker-compose.override.yml
# （已被 .gitignore 忽略）把 ./data 改挂到真实数据目录，勿改动本文件。
#
# 运行用户（重要）：容器以非 root 用户 app 运行，其 UID/GID 由构建参数对齐宿主用户
# （VIDEORAG_UID / VIDEORAG_GID，默认 1000:1000；取值见 `id -u` / `id -g`）。
# 这样 ./data 下文件属主与宿主一致，不会出现「容器写的文件裸机改不动」的权限冲突。
#   改动 UID/GID 后需重建：docker compose up -d --build
#   从旧版本（root 运行）升级且 ./data 已有 root 属主文件时，先一次性修复：
#     sudo chown -R "$(id -u)":"$(id -g)" ./data
# =============================================================================

name: videorag

services:
  # ---------------- 主服务（FastAPI + 前端静态资源） ----------------
  videorag:
    build:
      context: .
      # 运行用户 UID/GID 与宿主对齐（见文件头说明）；改后需 --build 重建
      args:
        APP_UID: "${VIDEORAG_UID:-1000}"
        APP_GID: "${VIDEORAG_GID:-1000}"
    image: videorag:latest
    container_name: videorag
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # 数据目录：视频/向量库/笔记/模型/运行时配置均持久化于此
      # 本机有真实数据时用 override 改挂（勿直接改本文件）
      - ./data:/data
      # 已下载媒体归档（可选，默认不启用）：转写用过的音频/视频留存副本在此。
      # 只有 .env 里 MEDIA_SAVE_DIR 非空（建议 /media）才真正归档；
      # 宿主目录默认 ./downloads，可用 MEDIA_SAVE_DIR_HOST 指向 NAS 共享/大容量盘。
      # 注意：宿主目录须与 VIDEORAG_UID/GID 属主一致（否则容器写不进）：
      #   mkdir -p ./downloads && chown "$(id -u)":"$(id -g)" ./downloads
      - ${MEDIA_SAVE_DIR_HOST:-./downloads}:/media
    environment:
      # ============ LLM（OpenAI 兼容；provider 仅作标识，base_url+model 决定实际调用）============
      LLM_PROVIDER: "${LLM_PROVIDER:-deepseek}"
      LLM_API_KEY: "${LLM_API_KEY:-}"                  # 必填：你的服务商 API Key
      LLM_BASE_URL: "${LLM_BASE_URL:-https://api.deepseek.com}"
      LLM_MODEL: "${LLM_MODEL:-deepseek-v4-flash}"

      # ============ Embedding ============
      # 默认本地 fastembed（CPU 友好，bge-small-zh 首次使用自动下载，无需远程）。
      # 切远程 OpenAI 兼容：EMBED_PROVIDER=openai + EMBED_BASE_URL/MODEL/KEY。
      EMBED_PROVIDER: "${EMBED_PROVIDER:-fastembed}"
      EMBED_MODEL: "${EMBED_MODEL:-BAAI/bge-small-zh-v1.5}"
      EMBED_BASE_URL: "${EMBED_BASE_URL:-}"
      EMBED_API_KEY: "${EMBED_API_KEY:-}"

      # ============ ASR ============
      # 档位一·集中远程 ASR（配置非空即启用，如局域网 SenseVoice /
      #   faster-whisper-server）：CLOUD_ASR_PROVIDER/BASE_URL/MODEL/KEY
      # 档位二·本地 SenseVoice 侧车：CLOUD_ASR_* 留空，启用下方 local-asr
      #   profile（需先在「设置 → 本地模型」下载模型到 ./data/models/asr）
      CLOUD_ASR_PROVIDER: "${CLOUD_ASR_PROVIDER:-}"
      CLOUD_ASR_BASE_URL: "${CLOUD_ASR_BASE_URL:-}"
      CLOUD_ASR_MODEL: "${CLOUD_ASR_MODEL:-}"
      CLOUD_ASR_KEY: "${CLOUD_ASR_KEY:-}"
      # 本地侧车端点（容器网内固定别名；仅本地档位命中，远程档位忽略）
      LOCAL_ASR_BASE_URL: "http://asr:9991"

      # ============ 其他 ============
      MCP_API_KEY: "${MCP_API_KEY:-change-me}"         # MCP 鉴权（建议修改）
      # COOKIE_DIR: "/data/cookies"                    # 可选：抖音/小红书 cookie 目录
      # 已下载媒体归档目录（可选）：留空/不设 = 不保存（默认）；填 /media 即启用。
      # 容器内 /media 由上方 volumes 映射到宿主 MEDIA_SAVE_DIR_HOST（默认 ./downloads）。
      MEDIA_SAVE_DIR: "${MEDIA_SAVE_DIR:-}"
    # ---- 资源约束（NAS 单容器场景建议保留） ----
    # 纯 CPU + 模型常驻（bge-small ≈100MB / SenseVoice ≈240MB）后，转写 / 笔记 /
    # embedding 会叠加峰值；不限内存时一旦 OOM 会拖垮整台 NAS。限制后超限由内核
    # OOM 杀容器，restart: unless-stopped 自动拉起，宿主系统不受影响。
    # VIDEORAG_MEM_LIMIT 默认 2g，按 NAS 实际内存调整（模型常驻 ~350MB 后留转写余量）。
    # pids 防 yt-dlp / ffmpeg 子进程失控 fork（每次转写会拉起若干子进程）。
    # 注意：pids 必须写在 deploy.resources.limits 里，不能另外用顶层 pids_limit——
    # Compose 视二者为同一字段，同时出现不同值会报
    # "can't set distinct values on 'pids_limit' and 'deploy.resources.limits.pids'"。
    deploy:
      resources:
        limits:
          memory: "${VIDEORAG_MEM_LIMIT:-2g}"
          pids: 256
    # 日志轮转：避免 uvicorn/app 日志无限写入磁盘（默认 json-file 不轮转）。
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------------- 本地降级 ASR 侧车（sherpa-onnx + SenseVoice int8） ----------------
  # 轻量镜像（不含模型）；模型由 videorag「设置 → 本地模型」下载到共享数据目录，
  # 侧车只读加载。默认不启动：docker compose --profile local-asr up -d
  # 不暴露宿主端口，videorag 经容器网 http://asr:9991 访问（调试可 override 放开）。
  asr:
    build:
      context: ./deploy/asr
      # 与主服务保持同一 UID/GID，保证共享模型卷属主一致
      args:
        APP_UID: "${VIDEORAG_UID:-1000}"
        APP_GID: "${VIDEORAG_GID:-1000}"
    image: videorag-asr:latest
    container_name: videorag-asr
    profiles: ["local-asr"]
    restart: unless-stopped
    volumes:
      - ./data:/data:ro          # 与 videorag 共享同一数据目录（只读）
    environment:
      MODEL_DIR: "/data/models/asr"
      NUM_THREADS: "${NUM_THREADS:-4}"
      PORT: "9991"
    # SenseVoice int8 常驻 ≈240MB；限制内存防转写时无上限增长拖垮宿主。
    # pids 同样并入 deploy.resources.limits（原因见主服务注释）。
    deploy:
      resources:
        limits:
          memory: "${VIDEORAG_ASR_MEM_LIMIT:-1g}"
          pids: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9991/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
