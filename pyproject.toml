[project]
name = "videorag"
version = "0.1.0"
description = "Video to notes to RAG knowledge base, self-hosted in a single Docker container"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "yt-dlp>=2025.1",
    "faster-whisper>=1.0",
    "openai>=1.40",
    "lancedb>=0.30",
    "fastembed>=0.5",
    "mcp>=1.0,<2",
    # E3 视觉旁路：画面文字识别（ONNX，模型随包内置，纯 CPU）
    "rapidocr-onnxruntime>=1.3",
    # 关键帧图像指纹去重（dHash）；uv.lock 中已作为 fastembed 传递依赖存在，
    # 此处显式声明避免依赖漂移
    "pillow>=10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
