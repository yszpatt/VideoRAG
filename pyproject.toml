[project]
name = "videorag"
version = "0.1.0"
description = "Video to notes to RAG knowledge base, self-hosted in a single Docker container"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "yt-dlp>=2025.1",
    "faster-whisper>=1.0",
    "openai>=1.40",
    "lancedb>=0.30",
    "fastembed>=0.5",
    "mcp>=1.0,<2",
    # E3 视觉旁路：画面文字识别（ONNX，模型随包内置，纯 CPU）
    "rapidocr-onnxruntime>=1.3",
    # 关键帧图像指纹去重（dHash）；uv.lock 中已作为 fastembed 传递依赖存在，
    # 此处显式声明避免依赖漂移
    "pillow>=10",
    # 进程内 SenseVoice 的分块/分句（app/core/transcribers/sensevoice_segments.py）
    # 直接使用 numpy；uv.lock 中已作为 fastembed 传递依赖存在，显式声明避免依赖漂移
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    # lint（CI 与本机共用同一份配置，见下方 [tool.ruff]）
    "ruff>=0.16",
]
# Windows 桌面包专用（Docker 镜像不装，保持主镜像轻量）：
# - sherpa-onnx：进程内 SenseVoice 推理（ASR_LOCAL_BACKEND=inproc）
# - pywebview：原生窗口（Windows 走 Edge WebView2 后端，经 pythonnet 做 CLR 桥）
# - pyinstaller：打包为本地应用
desktop = [
    "sherpa-onnx>=1.13",
    "pywebview>=5.0",
    "pyinstaller>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
# 与项目既有排版一致（注释里长句较多，不强求 88）
line-length = 100
# 与 Dockerfile / Windows 打包工作流对齐的运行时下限
target-version = "py311"

[tool.ruff.lint]
# 保守起步：只拦「真会出错」的问题——未定义名/未使用导入与变量/导入排序。
# 刻意不启用 E501（行宽）与 ruff-format，避免一次性重排全库、把历史 diff 淹没。
# 需要更严时逐条加 select（如 B / SIM / RUF），并同步修存量。
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
